name: Deploy AgentGuard website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'

jobs:
  # ── Deploy to dev.cairo.sh (GCP dev server 130.211.233.141) ──────────────
  deploy-dev:
    name: Deploy → dev.cairo.sh/AgentGuard
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to dev server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"

            cd /var/www/html/ivtspl/cairo-agent-guard
            git pull origin main

            cd website
            npm install --legacy-peer-deps --silent
            npm run build

            pm2 restart agentguard-dev
            sleep 5

            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/AgentGuard)
            if [ "$STATUS" != "200" ]; then
              echo "Dev smoke test failed: HTTP $STATUS"
              exit 1
            fi
            echo "Dev deploy OK — HTTP $STATUS"

  # ── Deploy to cairo.sh (GCP prod server 34.171.166.24) ───────────────────
  deploy-prod:
    name: Deploy → cairo.sh/AgentGuard
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - name: Deploy to prod server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"

            cd /var/www/html/cairo/cairo-agent-guard
            git pull origin main

            cd website
            npm install --legacy-peer-deps --silent
            npm run build

            pm2 restart agentguard
            sleep 5

            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/AgentGuard)
            if [ "$STATUS" != "200" ]; then
              echo "Prod smoke test failed: HTTP $STATUS"
              exit 1
            fi
            echo "Prod deploy OK — HTTP $STATUS"
